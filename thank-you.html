<script>
    document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form from submitting the default way

        // Show the loading message
        document.querySelector('.loading').style.display = 'block';

        // Simulate form submission process
        setTimeout(function() {
            // Hide the loading message
            document.querySelector('.loading').style.display = 'none';

            // Show the sent-message
            document.querySelector('.sent-message').style.display = 'block';
        }, 2000); // Adjust the time as needed
    });
});

</script>
<script>
    const appearElements = document.querySelectorAll('.appear');

const cb = function (entries, observer) {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('inview');
      // Stop observing the element after the first time it comes into view
      observer.unobserve(entry.target);
    }
  });
};

const io = new IntersectionObserver(cb);

appearElements.forEach(element => {
  io.observe(element);
});


</script>
<script>
    var lang = {
    "html": "100%",
    "css": "90%",
    "javascript": "70%",
    "php": "92%",
    "angular": "65%"
  };

  var multiply = 4;

  $.each(lang, function(language, pourcent) {
    let delayMultiplier = multiply; // Capture the correct value
    setTimeout(function() {
      $('#' + language + '-pourcent').html(pourcent);
    }, 700 * delayMultiplier);
    multiply++;
  });
</script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    $(document).ready(function () {

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      var $circle = document.querySelector('.circle'),
          $follow = document.querySelector('.circle-follow');

      function moveCircle(e) {
        gsap.to($circle, { duration: 0.3, x: e.clientX, y: e.clientY });
        gsap.to($follow, { duration: 0.7, x: e.clientX, y: e.clientY });
      }

      window.addEventListener('mousemove', moveCircle);
    });
</script>
